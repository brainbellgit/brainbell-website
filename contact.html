		<!-- EmailJS Integration -->
		<script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
		<script type="text/javascript">
			(function(){
				// Initialize EmailJS with your Public Key
				// Replace 'YOUR_PUBLIC_KEY' with your actual EmailJS public key
				emailjs.init("AMOvVPBXMZQqbZFme"); // You'll get this from emailjs.com
			})();

			// Handle form submission
			document.getElementById('contact-form').addEventListener('submit', function(event) {
				event.preventDefault();
				
				// Get form button for loading state
				const submitButton = this.querySelector('button[type="submit"]');
				const originalButtonText = submitButton.innerHTML;
				
				// Show loading state
				submitButton.innerHTML = '<span>Sending...</span>';
				submitButton.disabled = true;
				
				// Prepare email template parameters
				const templateParams = {
					firstname: document.getElementById('firstname').value,
					surname: document.getElementById('surname').value,
					email: document.getElementById('email').value,
					birthmonth: document.getElementById('birthmonth').value || 'Not provided',
					message: document.getElementById('message').value,
					to_email: 'chris@brainbell.com.au' // Your email address
				};
				
				// Send email using EmailJS
				// Replace 'YOUR_SERVICE_ID' and 'YOUR_TEMPLATE_ID' with your actual IDs from emailjs.com
				emailjs.send('service_whzavpl', 'template_qotwo7d', templateParams)
					.then(function(response) {
						// Success message
						submitButton.innerHTML = '<span>✓ Sent!</span>';
						submitButton.style.backgroundColor = '#10b981';
						
						// Reset form
						document.getElementById('contact-form').reset();
						
						// Reset button after 3 seconds
						setTimeout(function() {
							submitButton.innerHTML = originalButtonText;
							submitButton.style.backgroundColor = '#1e3a8a';
							submitButton.disabled = false;
						}, 3000);
					}, function(error) {
						// Error message
						submitButton.innerHTML = '<span>✗ Error - Try Again</span>';
						submitButton.style.backgroundColor = '#ef4444';
						
						// Reset button after 3 seconds
						setTimeout(function() {
							submitButton.innerHTML = originalButtonText;
							submitButton.style.backgroundColor = '#1e3a8a';
							submitButton.disabled = false;
						}, 3000);
						
						console.error('EmailJS Error:', error);
					});
			});
		</script>
